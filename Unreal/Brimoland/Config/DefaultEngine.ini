; Les réglages de rendu de Brimoland (voir Unreal/Rendu/RECETTE.md, §1) : déjà faits ici, rien à cocher à la main.

[/Script/Engine.RendererSettings]
; le pochoir : l'épaisseur du trait choisie par objet (Custom Depth-Stencil Pass : Enabled with Stencil)
r.CustomDepth=3
; l'éclairement doit rester stable, et le dessin n'a ni halo, ni flou, ni reflet
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
; pas d'éclairage global ni de reflets pour commencer (Lumen adoucit trop les ombres)
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
; l'anticrénelage TSR, à pleine résolution (le nœud d'encre lit les images de la scène à pleine taille)
r.AntiAliasingMethod=4

[SystemSettings]
r.ScreenPercentage=100

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
